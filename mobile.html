<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>庞云谦 - 音乐盒</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #fff5e6 0%, #ffe4c4 50%, #ffd4a8 100%);
      min-height: 100vh;
      color: #5a3e2b;
      overflow-x: hidden;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      min-height: 100vh;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 24px 0 20px;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #8b4513;
      letter-spacing: 2px;
    }

    .header p {
      font-size: 13px;
      color: #a08060;
      margin-top: 6px;
    }

    /* Now Playing Card */
    .now-playing {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(139, 69, 19, 0.1);
      backdrop-filter: blur(10px);
    }

    .album-art {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9a56, #ff6b35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
      animation: rotate 20s linear infinite;
      animation-play-state: paused;
    }

    .album-art.playing {
      animation-play-state: running;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .music-icon {
      width: 60px;
      height: 60px;
      fill: white;
      opacity: 0.9;
    }

    .song-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .song-title {
      font-size: 18px;
      font-weight: 600;
      color: #5a3e2b;
      margin-bottom: 4px;
    }

    .song-artist {
      font-size: 13px;
      color: #a08060;
    }

    /* Progress Bar */
    .progress-container {
      margin-bottom: 16px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(139, 69, 19, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff9a56, #ff6b35);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #b09080;
      margin-top: 6px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .btn-control {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #fff5e6, #ffe4c4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(139, 69, 19, 0.1);
    }

    .btn-control:active {
      transform: scale(0.95);
    }

    .btn-control svg {
      width: 20px;
      height: 20px;
      fill: #8b4513;
    }

    .btn-play {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #ff9a56, #ff6b35);
      box-shadow: 0 4px 16px rgba(255, 107, 53, 0.4);
    }

    .btn-play svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    .btn-play.playing {
      background: linear-gradient(135deg, #e85d2d, #c44a1f);
    }

    /* Playlist */
    .playlist-section {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(139, 69, 19, 0.1);
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #8b4513;
      margin-bottom: 14px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title svg {
      width: 18px;
      height: 18px;
      fill: #ff6b35;
    }

    .playlist {
      list-style: none;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      padding: 12px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 4px;
    }

    .playlist-item:hover {
      background: rgba(255, 154, 86, 0.1);
    }

    .playlist-item.active {
      background: rgba(255, 107, 53, 0.15);
    }

    .playlist-item:last-child {
      margin-bottom: 0;
    }

    .item-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff9a56, #ff6b35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .item-icon svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 14px;
      color: #5a3e2b;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-duration {
      font-size: 11px;
      color: #b09080;
      margin-top: 2px;
    }

    .item-playing {
      width: 20px;
      height: 20px;
      fill: #ff6b35;
      animation: pulse 1s ease infinite;
      display: none;
    }

    .playlist-item.active .item-playing {
      display: block;
    }

    .playlist-item.active .item-icon {
      background: linear-gradient(135deg, #e85d2d, #c44a1f);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Upload Section */
    .upload-section {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(139, 69, 19, 0.1);
    }

    .upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border: 2px dashed #e0c8b0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      color: #8b4513;
    }

    .upload-label:hover {
      border-color: #ff9a56;
      background: rgba(255, 154, 86, 0.08);
    }

    .upload-label svg {
      width: 22px;
      height: 22px;
      fill: #ff6b35;
    }

    .upload-input {
      display: none;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: #b09080;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: #e0c8b0;
      margin-bottom: 10px;
    }

    .empty-state p {
      font-size: 13px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px 0;
      font-size: 11px;
      color: #c0a080;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <svg class="header-icon" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="30" fill="url(#grad1)" />
        <path d="M26 44V20l20 12-20 12z" fill="white" />
        <defs>
          <linearGradient id="grad1" x1="0" y1="0" x2="64" y2="64">
            <stop offset="0%" stop-color="#ff9a56"/>
            <stop offset="100%" stop-color="#ff6b35"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>庞云谦的音乐盒</h1>
      <p>记录成长中的每一首旋律</p>
    </div>

    <!-- Now Playing -->
    <div class="now-playing">
      <div class="album-art" id="albumArt">
        <svg class="music-icon" viewBox="0 0 24 24">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <div class="song-info">
        <div class="song-title" id="songTitle">选择一首歌曲</div>
        <div class="song-artist" id="songArtist">家庭音乐</div>
      </div>
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn-control" id="btnPrev" title="上一首">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-control btn-play" id="btnPlay" title="播放">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-control" id="btnNext" title="下一首">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist-section">
      <div class="section-title">
        <svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
        播放列表
      </div>
      <ul class="playlist" id="playlist">
        <li class="playlist-item" data-src="music/xiaoxingxing.mp3">
          <div class="item-icon">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <div class="item-info">
            <div class="item-title">小星星</div>
            <div class="item-duration">--:--</div>
          </div>
          <svg class="item-playing" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </li>
        <li class="playlist-item" data-src="music/xingxing.mp3">
          <div class="item-icon">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <div class="item-info">
            <div class="item-title">星星</div>
            <div class="item-duration">--:--</div>
          </div>
          <svg class="item-playing" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </li>
      </ul>
    </div>

    <!-- Upload -->
    <div class="upload-section">
      <div class="section-title">
        <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
        添加本地音乐
      </div>
      <label class="upload-label">
        <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
        点击上传 MP3 文件
      </label>
      <input type="file" class="upload-input" id="fileUpload" accept="audio/mpeg,audio/mp3">
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>庞云谦家庭相册 &copy; 2026</p>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const audio = document.getElementById('audioPlayer');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const albumArt = document.getElementById('albumArt');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const playlist = document.getElementById('playlist');
    const fileUpload = document.getElementById('fileUpload');

    let isPlaying = false;
    let currentIndex = -1;
    let playlistItems = [];

    // Format time
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }

    // Play track
    function playTrack(index) {
      if (index < 0 || index >= playlistItems.length) return;
      
      currentIndex = index;
      const item = playlistItems[index];
      const src = item.dataset.src || item.fileUrl;
      
      audio.src = src;
      audio.play().catch(() => {});
      
      songTitle.textContent = item.querySelector('.item-title').textContent;
      songArtist.textContent = '家庭音乐';
      
      document.querySelectorAll('.playlist-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      
      isPlaying = true;
      updatePlayBtn();
    }

    // Update play button
    function updatePlayBtn() {
      albumArt.classList.toggle('playing', isPlaying);
      btnPlay.classList.toggle('playing', isPlaying);
      playIcon.innerHTML = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    // Toggle play/pause
    function togglePlay() {
      if (playlistItems.length === 0) return;
      
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        if (currentIndex < 0) {
          currentIndex = 0;
          playTrack(0);
        } else {
          audio.play().catch(() => {});
          isPlaying = true;
        }
      }
      updatePlayBtn();
    }

    // Next track
    function nextTrack() {
      if (playlistItems.length === 0) return;
      currentIndex = (currentIndex + 1) % playlistItems.length;
      playTrack(currentIndex);
    }

    // Prev track
    function prevTrack() {
      if (playlistItems.length === 0) return;
      currentIndex = (currentIndex - 1 + playlistItems.length) % playlistItems.length;
      playTrack(currentIndex);
    }

    // Update progress
    function updateProgress() {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalTimeEl.textContent = formatTime(audio.duration);
      }
    }

    // Event listeners
    btnPlay.addEventListener('click', togglePlay);
    document.getElementById('btnNext').addEventListener('click', nextTrack);
    document.getElementById('btnPrev').addEventListener('click', prevTrack);

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', nextTrack);

    // Playlist click
    playlist.addEventListener('click', (e) => {
      const item = e.target.closest('.playlist-item');
      if (item) {
        const items = Array.from(playlist.children);
        const index = items.indexOf(item);
        playTrack(index);
      }
    });

    // File upload
    fileUpload.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (file.type === 'audio/mpeg' || file.name.endsWith('.mp3')) {
          const url = URL.createObjectURL(file);
          const li = document.createElement('li');
          li.className = 'playlist-item';
          li.innerHTML = `
            <div class="item-icon">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <div class="item-info">
              <div class="item-title">${file.name.replace('.mp3', '')}</div>
              <div class="item-duration">--:--</div>
            </div>
            <svg class="item-playing" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          `;
          li.fileUrl = url;
          playlist.appendChild(li);
          playlistItems.push(li);
        }
      });
      fileUpload.value = '';
    });

    // Init playlist items
    playlistItems = Array.from(playlist.children);

    // Auto-load first track if exists
    if (playlistItems.length > 0) {
      playTrack(0);
      audio.pause();
      isPlaying = false;
      updatePlayBtn();
    }
  </script>
</body>
</html>

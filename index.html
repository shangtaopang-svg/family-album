        function Gallery({ gallery }) {
            const [activeTab, setActiveTab] = useState('全部');
            const [lightbox, setLightbox] = useState({ open: false, idx: 0 });
            const [uploadedPhotos, setUploadedPhotos] = useState([]);
            const [allPhotos, setAllPhotos] = useState([]);
            const fileInputRef = useRef(null);
            
            useEffect(() => {
                let photos = [];
                if (activeTab === '全部') {
                    Object.values(gallery).forEach(cat => photos.push(...cat));
                    photos = [...photos, ...uploadedPhotos];
                } else {
                    photos = gallery[activeTab] || [];
                }
                setAllPhotos(photos);
            }, [activeTab, gallery, uploadedPhotos]);
            
            const openLightbox = (idx) => setLightbox({ open: true, idx });
            const closeLightbox = () => setLightbox({ open: false, idx: 0 });
            const prevPhoto = () => setLightbox(l => ({ ...l, idx: (l.idx - 1 + allPhotos.length) % allPhotos.length }));
            const nextPhoto = () => setLightbox(l => ({ ...l, idx: (l.idx + 1) % allPhotos.length }));
            
            useEffect(() => {
                const handleKey = (e) => {
                    if (!lightbox.open) return;
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') prevPhoto();
                    if (e.key === 'ArrowRight') nextPhoto();
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [lightbox.open, allPhotos.length]);
            
            const handleFiles = (files) => {
                files.forEach(file => {
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            setUploadedPhotos(prev => [...prev, {
                                id: Date.now() + Math.random(),
                                date: new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long' }),
                                title: file.name.replace(/\.[^/.]+$/, ''),
                                img: evt.target.result
                            }]);
                        };
                        reader.readAsDataURL(file);
                    }
                });
            };
            
            const handleDrop = (e) => {
                e.preventDefault();
                e.currentTarget.classList.remove('dragover');
                handleFiles(Array.from(e.dataTransfer.files));
            };
            
            const categories = Object.keys(gallery);
            
            return (
                <section className="section" id="gallery">
                    <div className="section-header">
                        <div className="section-tag">Gallery</div>
                        <h2 className="section-title">精彩照片</h2>
                    </div>
                    
                    <div className="gallery-tabs">
                        <button className={`gallery-tab ${activeTab === '全部' ? 'active' : ''}`} onClick={() => setActiveTab('全部')}>全部</button>
                        {categories.filter(k => k !== '全部').map(cat => (
                            <button key={cat} className={`gallery-tab ${activeTab === cat ? 'active' : ''}`} onClick={() => setActiveTab(cat)}>{cat}</button>
                        ))}
                    </div>
                    
                    <div className="gallery-grid">
                        {allPhotos.map((photo, idx) => (
                            <div key={photo.id} className="gallery-item" onClick={() => openLightbox(idx)}>
                                <img src={photo.img} alt={photo.title} className="gallery-img" loading="lazy" />
                                <div className="gallery-overlay">
                                    <div className="gallery-caption">
                                        <div className="gallery-caption-date">{photo.date}</div>
                                        <div>{photo.title}</div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="upload-section">
                        <div className="upload-header">
                            <div className="upload-title">上传新照片</div>
                            <button className="upload-btn" onClick={() => fileInputRef.current?.click()}>
                                <span>+</span> 添加照片
                            </button>
                            <input ref={fileInputRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={(e) => handleFiles(Array.from(e.target.files))} />
                        </div>
                        <div className="upload-area" onDrop={handleDrop} onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); }} onDragLeave={(e) => e.currentTarget.classList.remove('dragover')} onClick={() => fileInputRef.current?.click()}>
                            <div className="upload-icon">📷</div>
                            <div className="upload-text">拖拽照片到这里，或点击选择文件</div>
                            <div className="upload-hint">支持 JPG、PNG、GIF 等格式</div>
                        </div>
                    </div>
                    
                    <div className={`lightbox ${lightbox.open ? 'open' : ''}`} onClick={closeLightbox}>
                        <button className="lightbox-close" onClick={closeLightbox}>×</button>
                        <button className="lightbox-nav lightbox-prev" onClick={(e) => { e.stopPropagation(); prevPhoto(); }}>‹</button>
                        <img src={allPhotos[lightbox.idx]?.img} alt={allPhotos[lightbox.idx]?.title} className="lightbox-img" onClick={(e) => e.stopPropagation()} />
                        <button className="lightbox-nav lightbox-next" onClick={(e) => { e.stopPropagation(); nextPhoto(); }}>›</button>
                    </div>
                </section>
            );
        }
        
        function VideoSection({ videos }) {
            const [activeTab, setActiveTab] = useState('全部');
            const [playingVideo, setPlayingVideo] = useState(null);
            const fileInputRef = useRef(null);
            const [uploadedVideos, setUploadedVideos] = useState([]);
            
            const filteredVideos = activeTab === '全部' ? [...videos, ...uploadedVideos] : videos.filter(v => v.category === activeTab);
            const categories = [...new Set(videos.map(v => v.category))];
            
            const handleVideoUpload = (e) => {
                Array.from(e.target.files).forEach(file => {
                    if (file.type.startsWith('video/')) {
                        const url = URL.createObjectURL(file);
                        setUploadedVideos(prev => [...prev, {
                            id: Date.now() + Math.random(),
                            title: file.name.replace(/\.[^/.]+$/, ''),
                            date: new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long' }),
                            category: '日常',
                            videoUrl: url,
                            duration: '--:--'
                        }]);
                    }
                });
            };
            
            return (
                <section className="section video-section" id="videos">
                    <div className="section-header">
                        <div className="section-tag">Videos</div>
                        <h2 className="section-title">成长视频</h2>
                    </div>
                    
                    <div className="video-tabs">
                        <button className={`video-tab ${activeTab === '全部' ? 'active' : ''}`} onClick={() => setActiveTab('全部')}>全部</button>
                        {categories.map(cat => (
                            <button key={cat} className={`video-tab ${activeTab === cat ? 'active' : ''}`} onClick={() => setActiveTab(cat)}>{cat}</button>
                        ))}
                    </div>
                    
                    <div className="video-grid">
                        {filteredVideos.map(video => (
                            <div key={video.id} className="video-card">
                                <div className="video-player" onClick={() => setPlayingVideo(video)}>
                                    {playingVideo?.id === video.id && video.videoUrl ? (
                                        <video src={video.videoUrl} controls autoPlay style={{ width: '100%', height: '100%', objectFit: 'cover' }} onEnded={() => setPlayingVideo(null)} />
                                    ) : (
                                        <>
                                            <img src={video.thumbnail} alt={video.title} className="video-thumbnail" />
                                            <div className="video-play-btn">▶</div>
                                        </>
                                    )}
                                </div>
                                <div className="video-info">
                                    <h3 className="video-title">{video.title}</h3>
                                    <div className="video-meta"><span>{video.date}</span><span>{video.duration}</span></div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="upload-video-area">
                        <div className="upload-icon" style={{ fontSize: '2rem', marginBottom: '0.75rem' }}>🎬</div>
                        <div className="upload-text" style={{ marginBottom: '1rem' }}>上传新视频</div>
                        <button className="upload-video-btn" onClick={() => fileInputRef.current?.click()}>
                            <span>+</span> 选择视频文件
                        </button>
                        <input ref={fileInputRef} type="file" accept="video/*" multiple style={{ display: 'none' }} onChange={handleVideoUpload} />
                    </div>
                </section>
            );
        }
        
        function Milestones({ items }) {
            return (
                <section className="section milestones-section" id="milestones">
                    <div className="section-header">
                        <div className="section-tag">Milestones</div>
                        <h2 className="section-title">成长里程碑</h2>
                    </div>
                    <div className="milestones-grid">
                        {items.map((item, idx) => (
                            <div key={idx} className="milestone-card">
                                <div className="milestone-icon">{item.icon}</div>
                                <div className="milestone-age">{item.age}</div>
                                <h3 className="milestone-title">{item.title}</h3>
                                <p className="milestone-desc">{item.desc}</p>
                                <img src={item.img} alt={item.title} className="milestone-img" />
                            </div>
                        ))}
                    </div>
                </section>
            );
        }
        
        function Stats() {
            return (
                <section className="stats-section">
                    <div className="stats-grid">
                        <div className="stat-item"><div className="stat-number">7</div><div className="stat-label">年成长记录</div></div>
                        <div className="stat-item"><div className="stat-number">100+</div><div className="stat-label">张照片收藏</div></div>
                        <div className="stat-item"><div className="stat-number">6</div><div className="stat-label">项荣誉</div></div>
                        <div className="stat-item"><div className="stat-number">∞</div><div className="stat-label">的爱与祝福</div></div>
                    </div>
                </section>
            );
        }
        
        function Footer() {
            return (
                <footer className="footer">
                    <div className="footer-title">庞云谦的家庭影集</div>
                    <p className="footer-text">用 ♥ 记录生活 · 2018-2025</p>
                </footer>
            );
        }
        
        // ============ Admin Panel ============
        function AdminPanel({ data, onSave, onClose }) {
            const [password, setPassword] = useState('');
            const [loggedIn, setLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('family');
            const [editData, setEditData] = useState(data);
            const [showSave, setShowSave] = useState(false);
            
            const handleLogin = () => {
                if (password === ADMIN_PASSWORD) {
                    setLoggedIn(true);
                    setEditData(JSON.parse(JSON.stringify(data)));
                } else {
                    alert('密码错误');
                }
            };
            
            const handleSave = () => {
                onSave(editData);
                setShowSave(true);
                setTimeout(() => setShowSave(false), 2000);
            };
            
            const updateField = (section, idx, field, value) => {
                const newData = JSON.parse(JSON.stringify(editData));
                if (idx !== undefined) {
                    newData[section][idx][field] = value;
                } else if (section === 'growth') {
                    newData.growth[field] = value;
                }
                setEditData(newData);
            };
            
            const addItem = (section) => {
                const newData = JSON.parse(JSON.stringify(editData));
                if (section === 'family') newData.family.push({ role: '新成员', name: '姓名', birthday: '生日', avatar: '👤' });
                else if (section === 'timeline') newData.timeline.push({ date: '日期', age: '年龄', title: '标题', desc: '描述', stats: [] });
                else if (section === 'honor') newData.honor.push({ badge: '🏆', title: '标题', org: '机构', date: '日期', desc: '描述' });
                else if (section === 'favorites') newData.favorites.push({ name: '名称', avatar: '', desc: '描述', tags: [] });
                else if (section === 'milestones') newData.milestones.push({ icon: '⭐', age: '年龄', title: '标题', desc: '描述', img: '' });
                setEditData(newData);
            };
            
            const removeItem = (section, idx) => {
                const newData = JSON.parse(JSON.stringify(editData));
                newData[section].splice(idx, 1);
                setEditData(newData);
            };
            
            if (!loggedIn) {
                return (
                    <div className="admin-overlay" onClick={onClose}>
                        <div className="admin-login" onClick={e => e.stopPropagation()}>
                            <h2 className="admin-login-title">🔐 后台管理</h2>
                            <div className="admin-login-form">
                                <input
                                    type="password"
                                    className="admin-input"
                                    placeholder="请输入管理密码"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    onKeyPress={e => e.key === 'Enter' && handleLogin()}
                                />
                                <button className="admin-btn-primary" onClick={handleLogin}>登录</button>
                                <p style={{ fontSize: '0.8rem', color: 'var(--text-light)' }}>默认密码：123456</p>
                            </div>
                        </div>
                    </div>
                );
            }
            
            const renderTab = () => {
                switch (activeTab) {
                    case 'family':
                        return (
                            <div>
                                <h3 className="admin-section-title">👨‍👩‍👧 家庭成员</h3>
                                {editData.family.map((m, idx) => (
                                    <div key={idx} style={{ background: 'var(--bg-warm)', padding: '1rem', borderRadius: '12px', marginBottom: '1rem' }}>
                                        <div style={{display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1rem'}}>
                                            <div style={{width: '60px', height: '60px', borderRadius: '50%', background: 'var(--gradient)', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', flexShrink: 0}}>
                                                {m.avatar?.startsWith('data:') ? (
                                                    <img src={m.avatar} alt="" style={{width: '100%', height: '100%', objectFit: 'cover'}} />
                                                ) : (
                                                    <span style={{fontSize: '2rem'}}>{m.avatar}</span>
                                                )}
                                            </div>
                                            <div style={{flex: 1}}>
                                                <div className="admin-form-group">
                                                    <label className="admin-label">角色</label>
                                                    <input className="admin-input" value={m.role} onChange={e => updateField('family', idx, 'role', e.target.value)} />
                                                </div>
                                            </div>
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">姓名</label>
                                            <input className="admin-input" value={m.name} onChange={e => updateField('family', idx, 'name', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">生日</label>
                                            <input className="admin-input" value={m.birthday} onChange={e => updateField('family', idx, 'birthday', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">头像（点击上传图片）</label>
                                            <input type="file" accept="image/*" onChange={e => {
                                                const file = e.target.files[0];
                                                if (file) {
                                                    const reader = new FileReader();
                                                    reader.onload = ev => updateField('family', idx, 'avatar', ev.target.result);
                                                    reader.readAsDataURL(file);
                                                }
                                            }} style={{fontSize: '0.85rem'}} />
                                        </div>
                                        {/* 爸爸妈妈可以上传照片影集 */}
                                        {idx < 2 && (
                                            <div style={{marginTop: '1rem', paddingTop: '1rem', borderTop: '1px dashed #ddd'}}>
                                                <div className="admin-form-group">
                                                    <label className="admin-label">{m.role}的照片影集</label>
                                                    <input type="file" accept="image/*" multiple onChange={e => {
                                                        const files = Array.from(e.target.files);
                                                        const currentPhotos = m.photos || [];
                                                        const newPhotos = [...currentPhotos];
                                                        let loaded = 0;
                                                        files.forEach(file => {
                                                            const reader = new FileReader();
                                                            reader.onload = ev => {
                                                                newPhotos.push(ev.target.result);
                                                                loaded++;
                                                                if (loaded === files.length) {
                                                                    updateField('family', idx, 'photos', newPhotos);
                                                                }
                                                            };
                                                            reader.readAsDataURL(file);
                                                        });
                                                    }} style={{fontSize: '0.85rem'}} />
                                                    <div style={{fontSize: '0.8rem', color: 'var(--text-light)', marginTop: '0.5rem'}}>
                                                        已上传 {(m.photos || []).length} 张照片
                                                    </div>
                                                </div>
                                                {(m.photos || []).length > 0 && (
                                                    <div style={{display: 'flex', flexWrap: 'wrap', gap: '0.5rem', marginTop: '0.5rem'}}>
                                                        {(m.photos || []).map((photo, pi) => (
                                                            <div key={pi} style={{position: 'relative', width: '60px', height: '60px'}}>
                                                                <img src={photo} alt="" style={{width: '100%', height: '100%', objectFit: 'cover', borderRadius: '8px'}} />
                                                                <button onClick={() => {
                                                                    const newPhotos = [...(m.photos || [])];
                                                                    newPhotos.splice(pi, 1);
                                                                    updateField('family', idx, 'photos', newPhotos);
                                                                }} style={{position: 'absolute', top: '-5px', right: '-5px', width: '20px', height: '20px', borderRadius: '50%', background: 'red', color: 'white', border: 'none', fontSize: '12px', cursor: 'pointer'}}>×</button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        <button className="admin-btn-danger" onClick={() => removeItem('family', idx)}>删除</button>
                                    </div>
                                ))}
                                <button className="admin-btn-secondary" onClick={() => addItem('family')}>+ 添加成员</button>
                            </div>
                        );
                    
                    case 'music':
                        return (
                            <div>
                                <h3 className="admin-section-title">🎵 音乐列表（{editData.songs.length}首）</h3>
                                <p style={{ fontSize: '0.85rem', color: 'var(--text-light)', marginBottom: '1rem' }}>
                                    在这里管理歌曲：修改歌曲信息、删除歌曲、或添加新歌曲
                                </p>
                                {editData.songs.map((song, idx) => (
                                    <div key={idx} style={{ background: 'var(--bg-warm)', padding: '1rem', borderRadius: '12px', marginBottom: '1rem' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.75rem' }}>
                                            <span style={{ background: 'var(--primary)', color: 'white', padding: '0.25rem 0.75rem', borderRadius: '20px', fontSize: '0.8rem' }}>{idx + 1}</span>
                                            <strong style={{ color: 'var(--text-dark)' }}>{song.name}</strong>
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">歌曲名称</label>
                                            <input className="admin-input" value={song.name} onChange={e => updateField('songs', idx, 'name', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">歌手</label>
                                            <input className="admin-input" value={song.singer} onChange={e => updateField('songs', idx, 'singer', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">音频链接</label>
                                            <input className="admin-input" value={song.url} onChange={e => updateField('songs', idx, 'url', e.target.value)} placeholder="https://..." />
                                        </div>
                                        <button className="admin-btn-danger" onClick={() => removeItem('songs', idx)}>删除此歌曲</button>
                                    </div>
                                ))}
                                <button className="admin-btn-secondary" onClick={() => {
                                    const newData = JSON.parse(JSON.stringify(editData));
                                    newData.songs.push({ id: Date.now(), name: '新歌曲', singer: '歌手', url: '' });
                                    setEditData(newData);
                                }}>+ 添加歌曲</button>
                            </div>
                        );
                    
                    case 'carousel':
                        return (
                            <div>
                                <h3 className="admin-section-title">🎠 首页轮播图</h3>
                                {editData.carousel.map((item, idx) => (
                                    <div key={idx} style={{ background: 'var(--bg-warm)', padding: '1rem', borderRadius: '12px', marginBottom: '1rem' }}>
                                        <div className="admin-form-group">
                                            <label className="admin-label">图片URL</label>
                                            <input className="admin-input" value={item.img} onChange={e => updateField('carousel', idx, 'img', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">标签</label>
                                            <input className="admin-input" value={item.badge} onChange={e => updateField('carousel', idx, 'badge', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">标题</label>
                                            <input className="admin-input" value={item.title} onChange={e => updateField('carousel', idx, 'title', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">副标题</label>
                                            <input className="admin-input" value={item.subtitle} onChange={e => updateField('carousel', idx, 'subtitle', e.target.value)} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        );
                    
                    case 'timeline':
                        return (
                            <div>
                                <h3 className="admin-section-title">📅 成长时间线</h3>
                                {editData.timeline.map((item, idx) => (
                                    <div key={idx} style={{ background: 'var(--bg-warm)', padding: '1rem', borderRadius: '12px', marginBottom: '1rem' }}>
                                        <div className="admin-form-group">
                                            <label className="admin-label">日期</label>
                                            <input className="admin-input" value={item.date} onChange={e => updateField('timeline', idx, 'date', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">年龄</label>
                                            <input className="admin-input" value={item.age} onChange={e => updateField('timeline', idx, 'age', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">标题</label>
                                            <input className="admin-input" value={item.title} onChange={e => updateField('timeline', idx, 'title', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">描述</label>
                                            <textarea className="admin-textarea" value={item.desc} onChange={e => updateField('timeline', idx, 'desc', e.target.value)} />
                                        </div>
                                        <button className="admin-btn-danger" onClick={() => removeItem('timeline', idx)}>删除</button>
                                    </div>
                                ))}
                                <button className="admin-btn-secondary" onClick={() => addItem('timeline')}>+ 添加时间点</button>
                            </div>
                        );
                    
                    case 'growth':
                        return (
                            <div>
                                <h3 className="admin-section-title">📊 生长发育数据</h3>
                                <div className="admin-form-group">
                                    <label className="admin-label">年龄标签（逗号分隔）</label>
                                    <input className="admin-input" value={editData.growth.labels.join(',')} onChange={e => updateField('growth', null, 'labels', e.target.value.split(','))} />
                                </div>
                                <div className="admin-form-group">
                                    <label className="admin-label">身高数据（cm，逗号分隔）</label>
                                    <input className="admin-input" value={editData.growth.height.join(',')} onChange={e => updateField('growth', null, 'height', e.target.value.split(',').map(Number))} />
                                </div>
                                <div className="admin-form-group">
                                    <label className="admin-label">体重数据（kg，逗号分隔）</label>
                                    <input className="admin-input" value={editData.growth.weight.join(',')} onChange={e => updateField('growth', null, 'weight', e.target.value.split(',').map(Number))} />
                                </div>
                            </div>
                        );
                    
                    case 'honor':
                        return (
                            <div>
                                <h3 className="admin-section-title">🏆 荣誉墙</h3>
                                {editData.honor.map((item, idx) => (
                                    <div key={idx} style={{ background: 'var(--bg-warm)', padding: '1rem', borderRadius: '12px', marginBottom: '1rem' }}>
                                        <div className="admin-form-group">
                                            <label className="admin-label">图标</label>
                                            <input className="admin-input" value={item.badge} onChange={e => updateField('honor', idx, 'badge', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">荣誉名称</label>
                                            <input className="admin-input" value={item.title} onChange={e => updateField('honor', idx, 'title', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">颁发机构</label>
                                            <input className="admin-input" value={item.org} onChange={e => updateField('honor', idx, 'org', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">日期</label>
                                            <input className="admin-input" value={item.date} onChange={e => updateField('honor', idx, 'date', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">描述</label>
                                            <input className="admin-input" value={item.desc} onChange={e => updateField('honor', idx, 'desc', e.target.value)} />
                                        </div>
                                        <button className="admin-btn-danger" onClick={() => removeItem('honor', idx)}>删除</button>
                                    </div>
                                ))}
                                <button className="admin-btn-secondary" onClick={() => addItem('honor')}>+ 添加荣誉</button>
                            </div>
                        );
                    
                    case 'favorites':
                        return (
                            <div>
                                <h3 className="admin-section-title">❤️ 爱好/喜欢的事物</h3>
                                {editData.favorites.map((item, idx) => (
                                    <div key={idx} style={{ background: 'var(--bg-warm)', padding: '1rem', borderRadius: '12px', marginBottom: '1rem' }}>
                                        <div className="admin-form-group">
                                            <label className="admin-label">名称</label>
                                            <input className="admin-input" value={item.name} onChange={e => updateField('favorites', idx, 'name', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">图片URL</label>
                                            <input className="admin-input" value={item.avatar} onChange={e => updateField('favorites', idx, 'avatar', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">描述</label>
                                            <textarea className="admin-textarea" value={item.desc} onChange={e => updateField('favorites', idx, 'desc', e.target.value)} />
                                        </div>
                                        <button className="admin-btn-danger" onClick={() => removeItem('favorites', idx)}>删除</button>
                                    </div>
                                ))}
                                <button className="admin-btn-secondary" onClick={() => addItem('favorites')}>+ 添加爱好</button>
                            </div>
                        );
                    
                    case 'milestones':
                        return (
                            <div>
                                <h3 className="admin-section-title">⭐ 成长里程碑</h3>
                                {editData.milestones.map((item, idx) => (
                                    <div key={idx} style={{ background: 'var(--bg-warm)', padding: '1rem', borderRadius: '12px', marginBottom: '1rem' }}>
                                        <div className="admin-form-group">
                                            <label className="admin-label">图标</label>
                                            <input className="admin-input" value={item.icon} onChange={e => updateField('milestones', idx, 'icon', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">年龄</label>
                                            <input className="admin-input" value={item.age} onChange={e => updateField('milestones', idx, 'age', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">标题</label>
                                            <input className="admin-input" value={item.title} onChange={e => updateField('milestones', idx, 'title', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">描述</label>
                                            <input className="admin-input" value={item.desc} onChange={e => updateField('milestones', idx, 'desc', e.target.value)} />
                                        </div>
                                        <div className="admin-form-group">
                                            <label className="admin-label">图片URL</label>
                                            <input className="admin-input" value={item.img} onChange={e => updateField('milestones', idx, 'img', e.target.value)} />
                                        </div>
                                        <button className="admin-btn-danger" onClick={() => removeItem('milestones', idx)}>删除</button>
                                    </div>
                                ))}
                                <button className="admin-btn-secondary" onClick={() => addItem('milestones')}>+ 添加里程碑</button>
                            </div>
                        );
                    
                    default:
                        return null;
                }
            };
            
            return (
                <div className="admin-overlay" onClick={onClose}>
                    <div className="admin-panel" onClick={e => e.stopPropagation()}>
                        <div className="admin-header">
                            <h2 className="admin-title">⚙️ 后台管理</h2>
                            <button className="admin-close" onClick={onClose}>×</button>
                        </div>
                        <div className="admin-tabs">
                            <button className={`admin-tab ${activeTab === 'family' ? 'active' : ''}`} onClick={() => setActiveTab('family')}>家人</button>
                            <button className={`admin-tab ${activeTab === 'music' ? 'active' : ''}`} onClick={() => setActiveTab('music')}>音乐</button>
                            <button className={`admin-tab ${activeTab === 'carousel' ? 'active' : ''}`} onClick={() => setActiveTab('carousel')}>轮播</button>
                            <button className={`admin-tab ${activeTab === 'timeline' ? 'active' : ''}`} onClick={() => setActiveTab('timeline')}>时间线</button>
                            <button className={`admin-tab ${activeTab === 'growth' ? 'active' : ''}`} onClick={() => setActiveTab('growth')}>发育</button>
                            <button className={`admin-tab ${activeTab === 'honor' ? 'active' : ''}`} onClick={() => setActiveTab('honor')}>荣誉</button>
                            <button className={`admin-tab ${activeTab === 'favorites' ? 'active' : ''}`} onClick={() => setActiveTab('favorites')}>爱好</button>
                            <button className={`admin-tab ${activeTab === 'milestones' ? 'active' : ''}`} onClick={() => setActiveTab('milestones')}>里程碑</button>
                        </div>
                        <div className="admin-content">
                            {renderTab()}
                            <button className="admin-btn-primary" onClick={handleSave} style={{ marginTop: '2rem', width: '100%' }}>💾 保存更改</button>
                        </div>
                    </div>
                    <div className={`admin-save-indicator ${showSave ? 'show' : ''}`}>✓ 保存成功</div>
                </div>
            );
        }
        
        // App
        function App() {
            const [data, setData] = useState(loadData);
            const [showAdmin, setShowAdmin] = useState(false);
            const [atmosphere, setAtmosphere] = useState('none');
            const [showAtmoControl, setShowAtmoControl] = useState(false);
            
            const handleSave = (newData) => {
                setData(newData);
                saveData(newData);
            };
            
            const handleSongsChange = (songs) => {
                const newData = { ...data, songs };
                setData(newData);
                saveData(newData);
            };
            
            return (
                <div>
                    <Navigation onAdminClick={() => setShowAdmin(true)} />
                    <HeroCarousel slides={data.carousel} />
                    <FamilySection family={data.family} />
                    <NinghaiSection />
                    <Timeline items={data.timeline} />
                    <GrowthSection data={data.growth} />
                    <HonorSection items={data.honor} />
                    <FavoritesSection items={data.favorites} />
                    <Gallery gallery={data.gallery} />
                    <VideoSection videos={data.videos} />
                    <Milestones items={data.milestones} />
                    <Stats />
                    <Footer />
                    <MusicPlayer songs={data.songs} onSongsChange={handleSongsChange} />
                    {showAdmin && <AdminPanel data={data} onSave={handleSave} onClose={() => setShowAdmin(false)} />}
                    
                    {/* 氛围效果 */}
                    {atmosphere !== 'none' && <AtmosphereEffect type={atmosphere} />}
                    
                    {/* 氛围切换控制器 */}
                    <div style={{
                        position: 'fixed', top: '50%', right: '20px', transform: 'translateY(-50%)',
                        zIndex: 999, display: 'flex', flexDirection: 'column', gap: '10px'
                    }}>
                        {!showAtmoControl ? (
                            <button onClick={() => setShowAtmoControl(true)} style={{
                                width: '50px', height: '50px', borderRadius: '50%', border: 'none',
                                background: 'linear-gradient(135deg, #667eea, #764ba2)',
                                color: 'white', fontSize: '1.5rem', cursor: 'pointer',
                                boxShadow: '0 4px 15px rgba(102, 126, 234, 0.4)'
                            }}>
                                ✨
                            </button>
                        ) : (
                            <div style={{
                                background: 'white', borderRadius: '15px', padding: '10px',
                                boxShadow: '0 4px 20px rgba(0,0,0,0.15)'
                            }}>
                                <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                    <button onClick={() => { setAtmosphere('none'); setShowAtmoControl(false); }} style={{
                                        width: '40px', height: '40px', borderRadius: '50%', border: 'none',
                                        background: atmosphere === 'none' ? '#667eea' : '#f0f0f0',
                                        color: atmosphere === 'none' ? 'white' : '#666',
                                        fontSize: '1rem', cursor: 'pointer'
                                    }}>关</button>
                                    <button onClick={() => setAtmosphere('meteor')} style={{
                                        width: '40px', height: '40px', borderRadius: '50%', border: 'none',
                                        background: atmosphere === 'meteor' ? '#667eea' : '#f0f0f0',
                                        color: atmosphere === 'meteor' ? 'white' : '#666',
                                        fontSize: '1rem', cursor: 'pointer'
                                    }}>🌠</button>
                                    <button onClick={() => setAtmosphere('rain')} style={{
                                        width: '40px', height: '40px', borderRadius: '50%', border: 'none',
                                        background: atmosphere === 'rain' ? '#667eea' : '#f0f0f0',
                                        color: atmosphere === 'rain' ? 'white' : '#666',
                                        fontSize: '1rem', cursor: 'pointer'
                                    }}>🌧️</button>
                                    <button onClick={() => setAtmosphere('snow')} style={{
                                        width: '40px', height: '40px', borderRadius: '50%', border: 'none',
                                        background: atmosphere === 'snow' ? '#667eea' : '#f0f0f0',
                                        color: atmosphere === 'snow' ? 'white' : '#666',
                                        fontSize: '1rem', cursor: 'pointer'
                                    }}>❄️</button>
                                    <button onClick={() => setShowAtmoControl(false)} style={{
                                        width: '40px', height: '40px', borderRadius: '50%', border: 'none',
                                        background: '#f0f0f0', color: '#666', fontSize: '1rem', cursor: 'pointer'
                                    }}>×</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

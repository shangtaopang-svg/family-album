<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庞云谦的家庭影集 - 记录成长的每一天</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');
        
        :root {
            --primary: #8B7355;
            --primary-light: #A69076;
            --primary-dark: #6B5744;
            --accent: #D4A574;
            --accent-light: #E8C9A8;
            --bg-warm: #FDF8F3;
            --bg-cream: #F5EDE4;
            --text-dark: #3D3229;
            --text-medium: #6B5D4D;
            --text-light: #9A8A78;
            --white: #FFFFFF;
            --shadow: rgba(139, 115, 85, 0.12);
            --shadow-strong: rgba(139, 115, 85, 0.25);
            --gradient: linear-gradient(135deg, var(--accent-light), var(--primary-light));
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-warm);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(253, 248, 243, 0.95);
            backdrop-filter: blur(12px);
            z-index: 100;
            padding: 0 2rem;
            border-bottom: 1px solid rgba(139, 115, 85, 0.1);
        }
        
        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }
        
        .nav-logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.05em;
        }
        
        .nav-subtitle { font-size: 0.75rem; color: var(--text-light); font-weight: 400; }
        
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        
        .nav-link {
            color: var(--text-medium);
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.3s;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover, .nav-link.active { color: var(--primary); }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        
        .admin-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow-strong); }
        
        /* Music Player */
        .music-player {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 340px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 8px 40px var(--shadow-strong);
            z-index: 99;
            overflow: hidden;
        }
        
        /* Atmosphere Effect Canvas */
        .atmosphere-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .music-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient);
            border: none;
            box-shadow: 0 4px 20px var(--shadow-strong);
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: transform 0.3s;
        }
        
        .music-toggle:hover { transform: scale(1.1); }
        .music-toggle.hidden { display: none; }
        .music-toggle.playing { animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 165, 116, 0.5); }
            50% { box-shadow: 0 0 0 15px rgba(212, 165, 116, 0); }
        }
        
        .music-main {
            padding: 1.25rem;
            border-bottom: 1px solid var(--bg-cream);
        }
        
        .music-now {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .music-album {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        
        .music-info { flex: 1; min-width: 0; }
        .music-title { font-size: 0.95rem; font-weight: 500; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-artist { font-size: 0.8rem; color: var(--text-light); }
        
        .music-progress { margin-bottom: 0.75rem; }
        .music-progress-bar { height: 4px; background: var(--bg-cream); border-radius: 2px; cursor: pointer; position: relative; }
        .music-progress-fill { height: 100%; background: var(--gradient); border-radius: 2px; width: 0%; transition: width 0.1s; }
        .music-time { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-light); margin-top: 0.3rem; }
        
        .music-controls { display: flex; align-items: center; justify-content: center; gap: 1.5rem; }
        .music-ctrl { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-medium); transition: color 0.2s; padding: 0.5rem; }
        .music-ctrl:hover { color: var(--primary); }
        .music-ctrl.play { width: 48px; height: 48px; background: var(--gradient); border-radius: 50%; color: white; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        
        .music-minimize { position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-light); padding: 0.25rem; }
        
        .music-playlist { max-height: 220px; overflow-y: auto; padding: 0.5rem; }
        .music-playlist-title { font-size: 0.75rem; color: var(--text-light); padding: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .music-song {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .music-song:hover { background: var(--bg-warm); }
        .music-song.active { background: var(--bg-cream); }
        
        .music-song-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .music-song-info { flex: 1; min-width: 0; }
        .music-song-name { font-size: 0.85rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-song-singer { font-size: 0.75rem; color: var(--text-light); }
        
        .music-song-del {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-light);
            opacity: 0;
            transition: opacity 0.2s;
            padding: 0.25rem;
        }
        
        .music-song:hover .music-song-del { opacity: 1; }
        .music-song-del:hover { color: #e74c3c; }
        
        .music-add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: calc(100% - 1rem);
            margin: 0.5rem;
            padding: 0.75rem;
            border: 2px dashed var(--bg-cream);
            border-radius: 10px;
            background: none;
            color: var(--text-light);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .music-add-btn:hover { border-color: var(--accent); color: var(--accent); }
        
        /* Hero */
        .hero-carousel { height: 100vh; position: relative; overflow: hidden; background: var(--text-dark); }
        .carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
        .carousel-slide.active { opacity: 1; }
        .carousel-img { width: 100%; height: 100%; object-fit: cover; }
        
        .carousel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(61,50,41,0.3) 0%, rgba(61,50,41,0.65) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        
        .carousel-badge { background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); padding: 0.5rem 1.5rem; border-radius: 50px; color: white; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.3); }
        .carousel-title { font-family: 'Noto Serif SC', serif; font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 700; color: white; margin-bottom: 1rem; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .carousel-subtitle { font-size: clamp(1rem, 2vw, 1.3rem); color: rgba(255,255,255,0.9); max-width: 600px; margin-bottom: 2rem; }
        .carousel-info { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
        .carousel-info-item { background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); padding: 0.6rem 1.2rem; border-radius: 12px; color: white; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.2); }
        
        .carousel-dots { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.6rem; }
        .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.3s; border: none; }
        .carousel-dot.active { background: white; transform: scale(1.3); }
        
        .carousel-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border: none; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); color: white; font-size: 1.5rem; border-radius: 50%; cursor: pointer; transition: background 0.3s; display: flex; align-items: center; justify-content: center; }
        .carousel-arrow:hover { background: rgba(255,255,255,0.3); }
        
        .section { padding: 5rem 2rem; max-width: 1400px; margin: 0 auto; }
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-tag { display: inline-block; font-size: 0.75rem; color: var(--accent); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 0.75rem; }
        .section-title { font-family: 'Noto Serif SC', serif; font-size: clamp(1.8rem, 4vw, 2.5rem); color: var(--text-dark); margin-bottom: 0.75rem; }
        .section-desc { color: var(--text-light); max-width: 500px; margin: 0 auto; font-size: 0.95rem; }
        
        /* Family */
        .family-section { background: var(--white); }
        .family-container { max-width: 1100px; margin: 0 auto; }
        .family-hero { text-align: center; margin-bottom: 3rem; padding: 3rem; background: linear-gradient(145deg, var(--bg-warm) 0%, var(--bg-cream) 100%); border-radius: 30px; position: relative; overflow: hidden; }
        .family-hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--gradient); }
        .family-hero-title { font-family: 'Noto Serif SC', serif; font-size: 2.5rem; color: var(--text-dark); margin-bottom: 0.5rem; }
        .family-hero-subtitle { color: var(--text-light); font-size: 1rem; }
        
        .family-photo-wall { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 1.5rem; align-items: center; margin-bottom: 3rem; }
        .family-side-photo { display: flex; flex-direction: column; gap: 1.5rem; }
        .family-photo-item { background: var(--bg-cream); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px var(--shadow); transition: transform 0.3s; }
        .family-photo-item:hover { transform: translateY(-5px); }
        .family-photo-img { width: 100%; height: 180px; object-fit: cover; }
        .family-photo-caption { padding: 1rem; text-align: center; }
        .family-photo-name { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; color: var(--text-dark); }
        
        .family-center { text-align: center; }
        .family-main-photo { width: 100%; max-width: 350px; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 6px solid var(--accent-light); box-shadow: 0 12px 48px var(--shadow-strong); margin-bottom: 1.5rem; }
        .family-names-row { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .family-name-badge { background: var(--white); padding: 0.5rem 1.5rem; border-radius: 30px; box-shadow: 0 4px 16px var(--shadow); }
        .family-name-badge .role { font-size: 0.75rem; color: var(--accent); }
        .family-name-badge .name { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; color: var(--text-dark); }
        
        .family-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .family-card-new { background: var(--white); border-radius: 24px; padding: 2rem; box-shadow: 0 8px 32px var(--shadow); display: flex; align-items: center; gap: 1.5rem; transition: transform 0.3s, box-shadow 0.3s; border: 2px solid transparent; }
        .family-card-new:hover { transform: translateY(-5px); box-shadow: 0 12px 48px var(--shadow-strong); border-color: var(--accent-light); }
        .family-card-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 3rem; flex-shrink: 0; border: 4px solid var(--white); box-shadow: 0 4px 16px var(--shadow); }
        .family-card-info { flex: 1; }
        .family-card-role { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
        .family-card-name { font-family: 'Noto Serif SC', serif; font-size: 1.4rem; color: var(--text-dark); margin-bottom: 0.5rem; }
        .family-card-birthday { font-size: 0.9rem; color: var(--text-light); display: flex; align-items: center; gap: 0.5rem; }
        
        /* Timeline */
        .timeline-section { background: var(--bg-cream); }
        .timeline { position: relative; max-width: 900px; margin: 0 auto; }
        .timeline::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: var(--gradient); transform: translateX(-50%); }
        .timeline-item { position: relative; padding: 2rem 0; display: flex; align-items: flex-start; }
        .timeline-item:nth-child(odd) { flex-direction: row-reverse; text-align: right; }
        .timeline-item:nth-child(even) { text-align: left; }
        .timeline-dot { position: absolute; left: 50%; top: 2.5rem; width: 18px; height: 18px; background: var(--accent); border: 4px solid var(--white); border-radius: 50%; transform: translateX(-50%); box-shadow: 0 2px 12px var(--shadow); z-index: 1; }
        .timeline-content { width: calc(50% - 3rem); background: var(--white); padding: 1.75rem; border-radius: 20px; box-shadow: 0 4px 24px var(--shadow); }
        .timeline-date { font-size: 0.8rem; color: var(--accent); font-weight: 500; margin-bottom: 0.5rem; }
        .timeline-title { font-family: 'Noto Serif SC', serif; font-size: 1.25rem; color: var(--text-dark); margin-bottom: 0.5rem; }
        .timeline-text { font-size: 0.9rem; color: var(--text-medium); line-height: 1.7; }
        .timeline-stats { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
        .timeline-stat { background: var(--bg-warm); padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; color: var(--primary); }
        
        /* Growth */
        .growth-section { background: var(--white); }
        .growth-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 1000px; margin: 0 auto; }
        .growth-card { background: var(--bg-warm); border-radius: 20px; padding: 2rem; box-shadow: 0 8px 32px var(--shadow); }
        .growth-card-title { font-family: 'Noto Serif SC', serif; font-size: 1.2rem; color: var(--text-dark); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .growth-chart { max-height: 250px; }
        .growth-data { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 2rem; }
        .growth-data-item { text-align: center; padding: 1rem; background: var(--white); border-radius: 12px; }
        .growth-data-age { font-size: 0.75rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .growth-data-value { font-family: 'Noto Serif SC', serif; font-size: 1.3rem; color: var(--primary); font-weight: 600; }
        
        /* Honor */
        .honor-section { background: var(--bg-cream); }
        .honor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .honor-card { background: linear-gradient(145deg, #fff9f0 0%, var(--white) 100%); border-radius: 20px; padding: 1.5rem; box-shadow: 0 4px 24px var(--shadow); position: relative; overflow: hidden; border: 1px solid rgba(212, 165, 116, 0.2); }
        .honor-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gradient); }
        .honor-badge { width: 64px; height: 64px; background: var(--gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1rem; }
        .honor-title { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; color: var(--text-dark); margin-bottom: 0.5rem; }
        .honor-org { font-size: 0.8rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .honor-date { font-size: 0.75rem; color: var(--accent); }
        
        /* Favorites */
        .favorites-section { background: var(--white); }
        .favorites-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .favorite-card { background: var(--bg-warm); border-radius: 24px; padding: 2rem; text-align: center; box-shadow: 0 8px 32px var(--shadow); transition: transform 0.3s; }
        .favorite-card:hover { transform: translateY(-5px); }
        .favorite-avatar { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 1.5rem; object-fit: cover; border: 4px solid var(--accent-light); }
        .favorite-name { font-family: 'Noto Serif SC', serif; font-size: 1.3rem; color: var(--text-dark); margin-bottom: 0.5rem; }
        .favorite-desc { font-size: 0.9rem; color: var(--text-medium); line-height: 1.7; }
        .favorite-tags { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
        .favorite-tag { background: var(--white); padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; color: var(--primary); }
        
        /* Gallery */
        .gallery-tabs { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
        .gallery-tab { padding: 0.6rem 1.5rem; border: 2px solid var(--bg-cream); background: var(--white); color: var(--text-medium); font-size: 0.9rem; font-family: inherit; border-radius: 30px; cursor: pointer; transition: all 0.3s; }
        .gallery-tab:hover { border-color: var(--accent); color: var(--accent); }
        .gallery-tab.active { background: var(--primary); color: var(--white); border-color: var(--primary); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
        .gallery-item { position: relative; aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; cursor: pointer; box-shadow: 0 4px 20px var(--shadow); }
        .gallery-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .gallery-item:hover .gallery-img { transform: scale(1.08); }
        .gallery-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(61, 50, 41, 0.8) 100%); opacity: 0; transition: opacity 0.3s; display: flex; align-items: flex-end; padding: 1.25rem; }
        .gallery-item:hover .gallery-overlay { opacity: 1; }
        .gallery-caption { color: white; }
        .gallery-caption-date { font-size: 0.75rem; opacity: 0.8; margin-bottom: 0.25rem; }
        .upload-section { background: var(--bg-warm); border-radius: 24px; padding: 2.5rem; margin-top: 3rem; box-shadow: 0 8px 32px var(--shadow); }
        .upload-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .upload-title { font-family: 'Noto Serif SC', serif; font-size: 1.3rem; color: var(--text-dark); }
        .upload-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: var(--gradient); color: white; border: none; border-radius: 30px; font-size: 0.9rem; font-family: inherit; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow-strong); }
        .upload-area { border: 2px dashed var(--bg-cream); border-radius: 16px; padding: 3rem 2rem; text-align: center; transition: border-color 0.3s, background 0.3s; cursor: pointer; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: rgba(212, 165, 116, 0.05); }
        .upload-icon { font-size: 3rem; margin-bottom: 1rem; }
        .upload-text { color: var(--text-medium); font-size: 0.95rem; margin-bottom: 0.5rem; }
        .upload-hint { color: var(--text-light); font-size: 0.8rem; }
        
        /* Video */
        .video-section { background: var(--bg-cream); }
        .video-tabs { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 2.5rem; flex-wrap: wrap; }

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // ============ 默认数据 ============
        const defaultData = {

                { img: 'https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=1920&h=1080&fit=crop', badge: '精彩瞬间', title: '成长的足迹', subtitle: '每一步都值得被铭记。', info: ['宁海金阳小学'] },
                { img: 'https://images.unsplash.com/photo-1519689680058-324335c77eba?w=1920&h=1080&fit=crop', badge: '快乐童年', title: '幸福时光', subtitle: '愿你永远保持纯真与好奇。', info: ['金阳小学一年级'] }
            ],
            timeline: [
                { date: '2018年10月13日', age: '0岁', title: '庞云谦出生', desc: '农历九月初五，一个小生命来到这个世界。', stats: ['体重3.5kg'] },
                { date: '2021年9月', age: '3岁', title: '上幼儿园啦', desc: '进入宁海县实验幼儿园同三校区。', stats: ['同三校区'] },
                { date: '2024年9月', age: '6岁', title: '成为小学生', desc: '进入宁海金阳小学，成为一年级小学生！', stats: ['金阳小学'] }
            ],
            growth: {
                labels: ['出生', '1岁', '3岁', '5岁', '7岁'],
                height: [50, 76, 95, 112, 126],
                weight: [3.5, 10.5, 16.5, 21.5, 26.5]
            },
            honor: [
                { badge: '🏆', title: '小小画家', org: '幼儿园', date: '2022年', desc: '绘画比赛一等奖' },
                { badge: '⭐', title: '全能小明星', org: '金阳小学', date: '2024年', desc: '全科优秀' }
            ],
            favorites: [
                { name: '奥特曼', avatar: 'https://images.unsplash.com/photo-1609183590263-619fb60a1a84?w=200&h=200&fit=crop', desc: '喜欢迪迦奥特曼', tags: ['迪迦', '保护地球'] },
                { name: '哪吒', avatar: 'https://images.unsplash.com/photo-1536240478700-b869ad10e2f3?w=200&h=200&fit=crop', desc: '我命由我不由天', tags: ['哪吒之魔童降世'] },
                { name: '画画', avatar: 'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=200&h=200&fit=crop', desc: '喜欢画奥特曼', tags: ['绘画'] }
            ],
            gallery: {
                '日常': [{ id: 1, date: '2024年', title: '日常', img: 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=600&h=450&fit=crop' }]
            },
            videos: [
                { id: 1, title: '成长视频', date: '2024年', category: '日常', thumbnail: 'https://images.unsplash.com/photo-1536240478700-b869ad10e2f3?w=600&h=340&fit=crop', duration: '1:00' }
            ],
            milestones: [
                { icon: '👶', age: '出生', title: '来到这个世界', desc: '2018年10月13日', img: 'https://images.unsplash.com/photo-1544126592-807ade215a0b?w=400&h=300&fit=crop' },
                { icon: '📚', age: '6岁', title: '成为小学生', desc: '进入金阳小学', img: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=400&h=300&fit=crop' }
            ]
        };
        
        const ADMIN_PASSWORD='123456';
        
        const DATA_VERSION = 4;
        
        function loadData() {
            try {
                const saved = localStorage.getItem('familyAlbumData');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // 确保使用本地音乐
                    parsed.songs = [
                        { id: 1, name: '小星星', singer: '钢琴曲', url: './music/xiaoxingxing.mp3' },
                        { id: 2, name: '星星溜进来', singer: '轻快音乐', url: './music/xingxing.mp3' }
                    ];
                    parsed._version = DATA_VERSION;
                    return parsed;
                }
                return defaultData;
            } catch { return defaultData; }
        }
        
        function saveData(data) {
            localStorage.setItem('familyAlbumData', JSON.stringify(data));
        }
        
        // ============ 组件 ============
        
        function Navigation({ onAdminClick }) {
            const [active, setActive] = useState('home');
            
            const scrollTo = (id) => {
                setActive(id);
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            };
            
            return (
                <nav className="nav">
                    <div className="nav-inner">
                        <div>
                            <div className="nav-logo">庞云谦的家庭影集</div>
                            <div className="nav-subtitle">记录成长的每一个瞬间</div>
                        </div>
                        <ul className="nav-links">
                            <li><button className={`nav-link ${active === 'home' ? 'active' : ''}`} onClick={() => scrollTo('home')}>首页</button></li>
                            <li><button className={`nav-link ${active === 'family' ? 'active' : ''}`} onClick={() => scrollTo('family')}>家人</button></li>
                            <li><button className={`nav-link ${active === 'ninghai' ? 'active' : ''}`} onClick={() => scrollTo('ninghai')}>宁海</button></li>
                            <li><button className={`nav-link ${active === 'timeline' ? 'active' : ''}`} onClick={() => scrollTo('timeline')}>成长</button></li>
                            <li><button className={`nav-link ${active === 'growth' ? 'active' : ''}`} onClick={() => scrollTo('growth')}>发育</button></li>
                            <li><button className={`nav-link ${active === 'honor' ? 'active' : ''}`} onClick={() => scrollTo('honor')}>荣誉</button></li>
                            <li><button className={`nav-link ${active === 'favorites' ? 'active' : ''}`} onClick={() => scrollTo('favorites')}>爱好</button></li>
                            <li><button className={`nav-link ${active === 'gallery' ? 'active' : ''}`} onClick={() => scrollTo('gallery')}>照片</button></li>
                            <li><button className={`nav-link ${active === 'videos' ? 'active' : ''}`} onClick={() => scrollTo('videos')}>视频</button></li>
                            <li><button className="admin-btn" onClick={onAdminClick}>⚙️ 编辑</button></li>
                        </ul>
                    </div>
                </nav>
            );
        }
        
        // 钢琴曲播放器
        function MusicPlayer({ songs, onSongsChange }) {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [currentTime, setCurrentTime] = useState('0:00');
            const [duration, setDuration] = useState('0:00');
            const audioRef = useRef(null);
            
            const currentSong = songs[currentIdx];
            
            const togglePlay = () => {
                if (!currentSong?.url) return;
                if (isPlaying) {
                    audioRef.current?.pause();
                } else {
                    audioRef.current?.play().catch(() => {});
                }
                setIsPlaying(!isPlaying);
            };
            
            const selectSong = (idx) => {
                if (isPlaying && audioRef.current) {
                    audioRef.current.pause();
                }
                setCurrentIdx(idx);
                setIsPlaying(false);
                setProgress(0);
                setCurrentTime('0:00');
            };
            
            useEffect(() => {
                if (audioRef.current && currentSong?.url && isPlaying) {
                    audioRef.current.play().catch(() => setIsPlaying(false));
                }
            }, [currentSong, isPlaying]);
            
            const handleTimeUpdate = () => {
                if (audioRef.current && audioRef.current.duration) {
                    const p = (audioRef.current.currentTime / audioRef.current.duration) * 100;
                    setProgress(p || 0);
                    setCurrentTime(formatTime(audioRef.current.currentTime));
                }
            };
            
            const handleLoadedMetadata = () => {
                if (audioRef.current) {
                    setDuration(formatTime(audioRef.current.duration));
                }
            };
            
            const handleEnded = () => {
                setIsPlaying(false);
                if (songs.length > 1) {
                    setCurrentIdx((currentIdx + 1) % songs.length);
                }
            };
            
            const formatTime = (s) => {
                if (!s || isNaN(s)) return '0:00';
                return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
            };
            
            const handleProgressClick = (e) => {
                if (!currentSong?.url || !audioRef.current?.duration) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audioRef.current.currentTime = percent * audioRef.current.duration;
            };
            
            return (
                <div className="music-player" style={{ width: '320px' }}>
                    <audio 
                        ref={audioRef} 
                        src={currentSong?.url} 
                        onTimeUpdate={handleTimeUpdate} 
                        onLoadedMetadata={handleLoadedMetadata} 
                        onEnded={handleEnded}
                    />
                    
                    <div className="music-main">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1rem' }}>
                            <div className="music-album">{isPlaying ? '🎵' : '🎧'}</div>
                            <div className="music-info">
                                <div className="music-title">{currentSong?.name || '选择歌曲'}</div>
                                <div className="music-artist">{currentSong?.singer || ''}</div>
                            </div>
                        </div>
                        
                        <div className="music-progress">
                            <div className="music-progress-bar" onClick={handleProgressClick}>
                                <div className="music-progress-fill" style={{width: `${progress}%`}}></div>
                            </div>
                            <div className="music-time">
                                <span>{currentTime}</span>
                                <span>{duration}</span>
                            </div>
                        </div>
                        
                        <div className="music-controls">
                            <button className="music-ctrl" onClick={() => selectSong((currentIdx - 1 + songs.length) % songs.length)}>⏮</button>
                            <button className="music-ctrl play" onClick={togglePlay} disabled={!currentSong?.url}>
                                {isPlaying ? '⏸' : '▶'}
                            </button>
                            <button className="music-ctrl" onClick={() => selectSong((currentIdx + 1) % songs.length)}>⏭</button>
                        </div>
                    </div>
                    
                    <div style={{ padding: '1rem', borderTop: '1px solid var(--bg-cream)', maxHeight: '280px', overflowY: 'auto' }}>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-light)', marginBottom: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                            点击选择歌曲（共{songs.length}首）
                        </div>
                        {songs.map((song, idx) => (
                            <div
                                key={song.id || idx}

        // 氛围效果组件 - 流星雨/下雨/下雪
        function AtmosphereEffect({ type }) {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                let particles = [];
                let animationId;
                
                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                
                // 创建粒子
                const createParticles = () => {
                    particles = [];
                    const count = type === 'meteor' ? 50 : type === 'rain' ? 200 : 150;
                    for (let i = 0; i < count; i++) {
                        particles.push(createParticle());
                    }
                };
                
                const createParticle = () => {
                    if (type === 'meteor') {
                        return {
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height * 0.5,
                            size: Math.random() * 2 + 1,
                            speedY: Math.random() * 2 + 1,
                            speedX: Math.random() * 4 + 2,
                            opacity: Math.random() * 0.8 + 0.2,
                            tail: Math.random() * 50 + 30
                        };
                    } else if (type === 'rain') {
                        return {
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            length: Math.random() * 20 + 10,
                            speed: Math.random() * 10 + 15,
                            opacity: Math.random() * 0.3 + 0.1
                        };
                    } else {
                        return {
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            size: Math.random() * 4 + 2,
                            speedY: Math.random() * 1 + 0.5,
                            speedX: Math.random() * 1 - 0.5,
                            opacity: Math.random() * 0.6 + 0.4,
                            wobble: Math.random() * Math.PI * 2
                        };
                    }
                };
                
                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    particles.forEach((p, i) => {
                        if (type === 'meteor') {
                            // 流星
                            const gradient = ctx.createLinearGradient(p.x, p.y, p.x - p.tail, p.y + p.tail * 0.5);
                            gradient.addColorStop(0, `rgba(255, 255, 255, ${p.opacity})`);
                            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                            ctx.strokeStyle = gradient;
                            ctx.lineWidth = p.size;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p.x - p.tail, p.y + p.tail * 0.5);
                            ctx.stroke();
                            
                            p.x -= p.speedX;
                            p.y += p.speedY;
                            
                            if (p.y > canvas.height || p.x < 0) {
                                particles[i] = { ...createParticle(), x: Math.random() * canvas.width + 100, y: -50 };
                            }
                        } else if (type === 'rain') {
                            // 下雨
                            ctx.strokeStyle = `rgba(174, 194, 224, ${p.opacity})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p.x + 1, p.y + p.length);
                            ctx.stroke();
                            
                            p.y += p.speed;
                            p.x += 1;
                            
                            if (p.y > canvas.height) {
                                particles[i] = { ...createParticle(), y: -20 };
                            }
                        } else {
                            // 下雪
                            ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                            
                            p.wobble += 0.02;
                            p.x += Math.sin(p.wobble) * 0.5 + p.speedX * 0.2;
                            p.y += p.speedY;
                            
                            if (p.y > canvas.height) {
                                particles[i] = { ...createParticle(), y: -10 };
                            }
                        }
                    });
                    
                    animationId = requestAnimationFrame(animate);
                };
                
                createParticles();
                animate();
                
                return () => {
                    window.removeEventListener('resize', resize);
                    cancelAnimationFrame(animationId);
                };
            }, [type]);
            
            return (
                <canvas 
                    ref={canvasRef} 
                    className="atmosphere-canvas"
                    style={{ zIndex: 1, pointerEvents: 'none' }}
                />
            );
        }
